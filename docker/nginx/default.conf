server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /var/www/html/public;

    index index.php index.html;
    charset utf-8;

    client_max_body_size 36M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Dynamic SEO endpoints passed through to Laravel
    location ~* ^/(robots\.txt|sitemap.*\.xml|llms\.txt)$ {
        try_files $uri /index.php?$query_string;
        access_log off;
        log_not_found off;
    }

    # Static assets with caching
    location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|webp|woff2?|eot|ttf|otf)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
        try_files $uri =404;
    }

    # Prevent execution of any scripts in uploads directory
    location ~* ^/storage/.*\.php$ {
        deny all;
    }

    # Deny access to hidden/dot files (.env, .git, etc.)
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Main Front Controller Entrypoint
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM Handler
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 16 16k;
    }
}
