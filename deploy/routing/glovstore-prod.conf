# Prepared for Metohub/Glov domain routing; app data is not changed.
server {
    listen 80;
    listen [::]:80;
    server_name glovstore.metora.in;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name glovstore.metora.in;
    ssl_certificate /etc/letsencrypt/live/glovstore.metora.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/glovstore.metora.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 36m;
    location / {
        proxy_pass http://127.0.0.1:8003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120;
    }
}
