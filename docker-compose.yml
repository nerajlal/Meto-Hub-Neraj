services:
  # -------------------------------------------------------------
  # Application PHP-FPM Service
  # -------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: metohub-app:latest
    container_name: metohub_app
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - uploads_data:/var/www/html/public/storage
      - private_data:/var/www/html/storage/app/private
      - logs_data:/var/www/html/storage/logs
    networks:
      - metohub-network
    depends_on:
      db:
        condition: service_healthy

  # -------------------------------------------------------------
  # Web Server (Nginx)
  # -------------------------------------------------------------
  web:
    image: nginx:alpine
    container_name: metohub_web
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - uploads_data:/var/www/html/public/storage:ro
    networks:
      - metohub-network
    depends_on:
      - app

  # -------------------------------------------------------------
  # Queue Worker
  # -------------------------------------------------------------
  worker:
    image: metohub-app:latest
    container_name: metohub_worker
    restart: unless-stopped
    command: php artisan queue:work database --queue=order-notifications,default --sleep=1 --tries=3 --timeout=240
    stop_grace_period: 300s
    env_file:
      - .env
    volumes:
      - uploads_data:/var/www/html/public/storage
      - private_data:/var/www/html/storage/app/private
      - logs_data:/var/www/html/storage/logs
    networks:
      - metohub-network
    depends_on:
      db:
        condition: service_healthy

  # -------------------------------------------------------------
  # Scheduler (Cron tasks: billing, notifications, shipment alerts)
  # -------------------------------------------------------------
  scheduler:
    image: metohub-app:latest
    container_name: metohub_scheduler
    restart: unless-stopped
    command: php artisan schedule:work
    env_file:
      - .env
    volumes:
      - uploads_data:/var/www/html/public/storage
      - private_data:/var/www/html/storage/app/private
      - logs_data:/var/www/html/storage/logs
    networks:
      - metohub-network
    depends_on:
      db:
        condition: service_healthy

  # -------------------------------------------------------------
  # Database (MySQL 8.0)
  # -------------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: metohub_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-metohub}
      MYSQL_USER: ${DB_USERNAME:-metohub}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - metohub-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  metohub-network:
    driver: bridge

volumes:
  db_data:
    driver: local
  uploads_data:
    driver: local
  private_data:
    driver: local
  logs_data:
    driver: local
